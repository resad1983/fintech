:root {
  --bg: #eef1f2;
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --border: #d8dee1;
  --text: #1b2225;
  --text-muted: #5d6a70;
  --text-faint: #93a0a5;
  --accent: #a87830;
  --accent-soft: #a8783022;
  --rise: #c43d32;
  --rise-soft: #c43d3218;
  --fall: #2f7a55;
  --fall-soft: #2f7a5518;
  --warn: #b5650c;
  --warn-soft: #b5650c1c;
  --warn-weekly: #6a4fb3;
  --warn-weekly-soft: #6a4fb31c;
  --shadow: 0 1px 2px rgba(20, 30, 34, 0.06), 0 8px 24px rgba(20, 30, 34, 0.05);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #10161a;
    --surface: #171f24;
    --surface-raised: #1d262b;
    --border: #2a353b;
    --text: #ece7dd;
    --text-muted: #8f9ba1;
    --text-faint: #5b666c;
    --accent: #d3a35a;
    --accent-soft: #d3a35a22;
    --rise: #e0685a;
    --rise-soft: #e0685a22;
    --fall: #5cb98a;
    --fall-soft: #5cb98a22;
    --warn: #e0a840;
    --warn-soft: #e0a84022;
    --warn-weekly: #a78bda;
    --warn-weekly-soft: #a78bda22;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 12px 32px rgba(0, 0, 0, 0.35);
  }
}
:root[data-theme="dark"] {
  --bg: #10161a;
  --surface: #171f24;
  --surface-raised: #1d262b;
  --border: #2a353b;
  --text: #ece7dd;
  --text-muted: #8f9ba1;
  --text-faint: #5b666c;
  --accent: #d3a35a;
  --accent-soft: #d3a35a22;
  --rise: #e0685a;
  --rise-soft: #e0685a22;
  --fall: #5cb98a;
  --fall-soft: #5cb98a22;
  --warn: #e0a840;
  --warn-soft: #e0a84022;
  --warn-weekly: #a78bda;

}
:root[data-theme="light"] {
  --bg: #eef1f2;
  --surface: #ffffff;
  --surface-raised: #ffffff;
  --border: #d8dee1;
  --text: #1b2225;
  --text-muted: #5d6a70;
  --text-faint: #93a0a5;
  --accent: #a87830;
  --accent-soft: #a8783022;
  --rise: #c43d32;
  --rise-soft: #c43d3218;

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", -apple-system, sans-serif;
  min-height: 100vh;
}
.mono { font-family: "Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

.wrap {
  max-width: 1520px;
  margin: 0 auto;
  padding: 48px 40px 96px;
}

.masthead {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 16px;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--border);
  padding-bottom: 20px;
  margin-bottom: 28px;
}
.masthead-title {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.eyebrow {
  font-family: "Plex Mono", monospace;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--accent);
}
h1 {
  margin: 0;
  font-size: 32px;
  font-weight: 700;

function sectorRemark(s) {

  var t = "5日 " + amt(s.n5) + " · 最大貢獻 " + esc(s.top5.name) + " " + amt(s.top5.amt) + (s.heavy ? " 占" + Math.round(s.top5.share * 100) + "%" : "");
  return t + (s.verdict ? " · 扣除後 " + amt(s.ex5) + " → " + s.verdict : "");
}
function renderSectorRank() {
  var el = $("rank-sector");
  if (!SF) { el.innerHTML = '<div class="v2-card"><div class="v2-empty">還沒有法人資金流資料</div></div>'; return; }
  var nk = flowPer === "1" ? "n1" : "n5", rk = flowPer === "1" ? "r1" : "r5";
  var key = { buy: function (s) { return -s[nk]; }, sell: function (s) { return s[nk]; }, up: function (s) { return -(s[rk] == null ? -9 : s[rk]); }, down: function (s) { return s[rk] == null ? 9 : s[rk]; } }[flowMet];
  var list = SF.sectors.slice().sort(function (a, b) { return key(a) - key(b); });
  var h = ctrlBar() + '<div class="v2-note" style="margin:0 0 10px">淨額＝板塊成分股三大法人買賣超合計（億元）。每檔股票只歸屬一個板塊（它的產業大分類）；備註的「占 X%」＝該股占板塊毛流量（各股淨額絕對值合計）過半，板塊數字主要反映這一檔。資料日 ' + esc(SF.date) + '（法人資料晚一個交易日公布）。</div>';
  h += '<div class="v2-tablewrap"><table class="v2-table"><thead><tr><th>#</th><th>板塊（' + list.length + '個）</th><th class="num">' + (flowPer === "1" ? "今日" : "5日") + '漲跌</th><th class="num">' + (flowPer === "1" ? "今日" : "5日") + '淨額</th></tr></thead><tbody>';
  list.forEach(function (s, i) {
    h += '<tr data-sector="' + esc(s.name) + '"><td class="rk">' + (i + 1) + '</td><td><div class="nm">' + esc(s.name) + '</div><div class="rm">' + sectorRemark(s) + '</div></td><td class="num ' + ud(s[rk]) + '">' + pct(s[rk], 2) + '</td><td class="num ' + ud(s[nk]) + '">' + amt(s[nk]) + "</td></tr>";
  });
  el.innerHTML = h + "</tbody></table></div>";
}
function tagsFor(c) {
  var sgl = sigBy[c], t = "";
  if (sgl) t += sgl.strats.map(function (x) { return '<span class="v2-tag">' + esc(x.label) + "</span>"; }).join("");
  if (picksBig[c]) t += '<span class="v2-tag" style="background:var(--rise-soft)">基本面精選</span>';
  else if (picksSmall[c]) t += '<span class="v2-tag">基本面(小)</span>';
  return t;
}
function renderStockRank() {
  var el = $("rank-stock");
  if (!SF) { el.innerHTML = '<div class="v2-card"><div class="v2-empty">還沒有法人資料</div></div>'; return; }
  var ni = flowPer === "1" ? 0 : 1, ri = flowPer === "1" ? 3 : 4;
  var rows = Object.keys(SF.stocks).map(function (c) { return { c: c, f: SF.stocks[c], i: idx[c] }; }).filter(function (r) { return r.i; });
  if (flowMet === "up" || flowMet === "down") rows = rows.filter(function (r) { return r.f[5] === 1 && r.f[ri] != null; });
  var key = { buy: function (r) { return -r.f[ni]; }, sell: function (r) { return r.f[ni]; }, up: function (r) { return -r.f[ri]; }, down: function (r) { return r.f[ri]; } }[flowMet];
  rows.sort(function (a, b) { return key(a) - key(b); }); rows = rows.slice(0, 50);
  var h = ctrlBar() + '<div class="v2-note" style="margin:0 0 10px">前50名。漲幅／跌幅只列20日均成交金額≥1000萬的個股。點一列看個股面板。資料日 ' + esc(SF.date) + "。</div>";
  h += '<div class="v2-tablewrap"><table class="v2-table"><thead><tr><th>#</th><th>股票</th><th class="num">現價</th><th class="num">漲跌</th><th class="num">淨額</th><th>訊號</th><th></th></tr></thead><tbody>';
  rows.forEach(function (r, n) {
    h += '<tr data-open="' + r.c + '"><td class="rk">' + (n + 1) + '</td><td><div class="nm">' + esc(r.i.name) + '</div><div class="rm">' + esc(r.c) + "｜" + esc(r.i.industry || "") + '</div></td><td class="num">' + (r.i.close >= 100 ? r.i.close.toFixed(1) : r.i.close.toFixed(2)) +
      '</td><td class="num ' + ud(r.f[ri]) + '">' + pct(r.f[ri], 2) + '</td><td class="num ' + ud(r.f[ni]) + '">' + amt(r.f[ni]) + "</td><td>" + tagsFor(r.c) + "</td><td>" + starBtn(r.c) + "</td></tr>";
  });
  el.innerHTML = h + "</tbody></table></div>";
}
function openSector(name) {
  var s = SF && SF.sectors.filter(function (x) { return x.name === name; })[0];
  if (!s) return;
  var rot = D.rotation && D.rotation.industries.filter(function (x) { return x.name === name; })[0];
  var members = Object.keys(idx).filter(function (c) { return idx[c].industry === name && SF.stocks[c]; }).map(function (c) { return { c: c, f: SF.stocks[c], i: idx[c] }; }).sort(function (a, b) { return b.f[0] - a.f[0]; });
  var badge = s.n5 >= 0 ? '<span class="v2-badge hot">5日買超</span>' : '<span class="v2-badge cold">5日賣超</span>';
  var h = '<div class="v2-sheet-head"><b style="font-size:18px">' + esc(name) + "</b>" + badge + (rot ? '<span class="v2-badge">輪動：' + esc(rot.quadrant) + "</span>" : "") + '<button class="v2-close" id="shClose">關閉</button></div>';
  h += '<div class="v2-note" style="margin:0">' + s.members + " 檔有籌碼資料｜資料日 " + esc(SF.date) + "</div>";
  var st = function (k, v, c) { return '<div class="v2-stat"><span>' + k + '</span><b class="' + (c || "") + '">' + v + "</b></div>"; };
  h += '<div class="v2-stats">' + st("今日漲跌", pct(s.r1, 2), ud(s.r1)) + st("5日漲跌", pct(s.r5, 2), ud(s.r5)) + st("今日淨額", amt(s.n1), ud(s.n1)) + st("5日淨額", amt(s.n5), ud(s.n5)) + st("20日淨額", amt(s.n20), ud(s.n20)) +
    st("今日在買", s.buy1 + " / " + s.members + " 檔") + st("當日買超最多", esc(s.top1.name) + " " + amt(s.top1.amt)) + st("5日最大貢獻", esc(s.top5.name) + " 占 " + Math.round(s.top5.share * 100) + "%") +
    st("扣除" + esc(s.top5.name) + "·5日", amt(s.ex5) + (s.verdict ? " → " + s.verdict : ""), ud(s.ex5)) + "</div>";
  h += '<div class="v2-note">淨額＝成分股三大法人買賣超合計（億元），每檔只歸屬一個板塊（產業大分類）。上櫃法人資料自 9/16 起累積，20日淨額的上櫃部分可能不足20日。這是資金流的描述，不是買賣建議，也沒有回測過預測力。</div>';
  h += '<div class="v2-tablewrap" style="margin-top:10px;max-height:46vh;overflow:auto"><table class="v2-table"><thead><tr><th>#</th><th>股票</th><th class="num">現價</th><th class="num">漲跌</th><th class="num">今日淨額</th><th class="num">5日淨額</th><th class="num">20日淨額</th><th>訊號</th><th></th></tr></thead><tbody>';
  members.forEach(function (r, n) {
    h += '<tr data-open="' + r.c + '"><td class="rk">' + (n + 1) + '</td><td><div class="nm">' + esc(r.i.name) + '</div><div class="rm">' + esc(r.c) + '</div></td><td class="num">' + (r.i.close >= 100 ? r.i.close.toFixed(1) : r.i.close.toFixed(2)) +
      '</td><td class="num ' + ud(r.f[3]) + '">' + pct(r.f[3], 2) + '</td><td class="num ' + ud(r.f[0]) + '">' + amt(r.f[0]) + '</td><td class="num ' + ud(r.f[1]) + '">' + amt(r.f[1]) + '</td><td class="num ' + ud(r.f[2]) + '">' + amt(r.f[2]) + "</td><td>" + tagsFor(r.c) + "</td><td>" + starBtn(r.c) + "</td></tr>";
  });
  $("sheet").innerHTML = h + "</tbody></table></div>";
  $("modal").classList.add("open"); $("shClose").onclick = closeSheet;
}


/* ---------- 型態觀察(三角形壓力線突破，純參考) + 對帳 ---------- */
var PP = D.pattern_picks, PR = D.pattern_recon;
var GLABEL = { breakout: "今日突破", near: "預告觀察", spike: "異常爆量" };
function patRow(r) {
  var lvl = r.shape === "上升三角" ? "壓力線" : "支撐線";
  return '<div class="v2-item"><div class="v2-item-head" data-open="' + r.code + '"><span class="v2-code">' + esc(r.code) + '</span><span class="v2-name">' + esc(r.name) + '</span><span class="v2-price">' + r.close.toFixed(r.close >= 100 ? 1 : 2) + "</span>" + starBtn(r.code) + "</div>" +
    '<div class="v2-sub-line"><span class="v2-tag">' + esc(r.shape) + '</span><span class="v2-tag ind">' + esc(r.industry || "產業未知") + "</span><span>" + lvl + " <b>" + r.level.toFixed(r.level >= 100 ? 1 : 2) + "</b>（距" + pct(r.dist, 1) + "）</span><span>量比 <b>" + r.vr.toFixed(1) + "x</b></span><span>收縮率 " + Math.round(r.rr * 100) + "%</span><span>成交 " + (r.turnover / 1e8).toFixed(2) + "億</span>" +
    (r.group === "breakout" ? "<span>參考停損：收盤跌破 " + r.level.toFixed(r.level >= 100 ? 1 : 2) + "</span>" : "") + "</div></div>";
}
function renderPattern() {
  var el = $("rank-pattern");
  var h = '<div class="v2-card"><h2>型態觀察<span class="hint">三角形壓力線 · 純參考</span></h2><div class="v2-note" style="margin:0">這是參考一篇外部選股日報做的「觀察清單與每日對帳」，<b>不是買進訊號</b>。2026-10-14 用5年資料回測：這類三角形突破、預告、爆量在大小型股都沒有穩定的超額報酬，三角形條件也沒有比「一般量增突破」更好（回測重點見 output/triangle_strategy_backtest_*.txt）。保留它是為了觀察、對帳與紀律練習（先設好停損、不追當天高點）。</div></div>';
  if (!PP || !PP.groups) { el.innerHTML = h + '<div class="v2-card"><div class="v2-empty">還沒有型態觀察資料，明天排程跑完後出現。</div></div>'; return; }
  var tot = PP.total || {};
  h += '<div class="v2-card"><h2>今日摘要<span class="hint">' + esc(PP.date) + "</span></h2><div class=\"v2-kv\">突破 <b>" + (tot.breakout || 0) + "</b>｜預告 <b>" + (tot.near || 0) + "</b>｜爆量 <b>" + (tot.spike || 0) + "</b>（預告最多列" + PP.groups.near.length + "檔）</div>";
  if ((PP.clusters || []).length) h += '<div class="v2-kv">同產業集體出現：' + PP.clusters.map(function (c) { return '<span class="v2-chip plain">' + esc(c.industry) + ' <span class="n">' + c.codes.length + "</span>檔</span>"; }).join("") + "</div>";
  h += '<div class="v2-note">定義：上升三角＝近40日高點打平（至少2個相隔4天以上的高點落在最高價3%內）、低點墊高、振幅收縮（後20日平均振幅÷前20日≤0.8）；突破＝收盤站上壓力線且量比≥2（昨天還在線下）；預告＝收盤在壓力線97%～100%；爆量＝型態成立且量比≥4，只記錄不表態。成交金額20日均≥500萬才列。</div></div>';
  if (PR && PR.rows && PR.rows.length) {
    var st = PR.stats || {}, line = function (k, name) { var x = st[k]; return x ? '<span class="v2-chip plain">' + name + " " + x.n + "檔 平均 <b class=\"" + ud(x.mean) + "\">" + pct(x.mean, 2) + "</b>（" + x.up + "漲" + x.down + "跌）</span>" : ""; };
    h += '<div class="v2-card"><h2>對帳：上一份名單的表現<span class="hint">' + esc(PR.prev_date) + " → " + esc(PR.now_date) + "</span></h2><div class=\"v2-kv\">" + line("all", "全部") + line("breakout", "突破組") + line("near", "預告組") + line("spike", "爆量組") + "</div>" +
      (PR.taiex != null ? '<div class="v2-kv">同期加權指數 <b class="' + ud(PR.taiex) + '">' + pct(PR.taiex, 2) + "</b>" + (st.all ? "；名單平均比大盤" + (st.all.mean - PR.taiex >= 0 ? "好 " : "差 ") + Math.abs((st.all.mean - PR.taiex) * 100).toFixed(2) + " 個百分點" : "") + "</div>" : "") +
      '<div class="v2-tablewrap" style="margin-top:8px;max-height:44vh;overflow:auto"><table class="v2-table"><thead><tr><th>股票</th><th class="num">當時</th><th class="num">現在</th><th class="num">漲跌</th><th>狀態</th></tr></thead><tbody>' +
      PR.rows.map(function (r) { return '<tr data-open="' + r.code + '"><td><div class="nm">' + esc(r.name) + '</div><div class="rm">' + esc(r.code) + "｜" + GLABEL[r.group] + '</div></td><td class="num">' + r.prev.toFixed(2) + '</td><td class="num">' + r.now.toFixed(2) + '</td><td class="num ' + ud(r.pct) + '">' + pct(r.pct, 2) + "</td><td>" + esc(r.status) + "</td></tr>"; }).join("") + "</tbody></table></div>" +
      '<div class="v2-note">對帳是看「列入名單當天收盤」到「最新收盤」的變化，沒有扣成本，也不是回測；單日樣本很小，只當紀錄。</div></div>';
  } else h += '<div class="v2-card"><h2>對帳</h2><div class="v2-empty">明天起會顯示「上一份名單」的漲跌對帳。</div></div>';
  ["breakout", "near", "spike"].forEach(function (k) {
    var list = PP.groups[k] || [];
    var hint = { breakout: "收盤站上壓力線＋量比≥2；不追當天高點，先看後面兩三天守不守得住", near: "離壓力線3%內，帶量收上才算成立", spike: "量比≥4，只記錄、不表態；第二三天能不能延續才是重點" }[k];
    h += '<div class="v2-card"><h2>' + GLABEL[k] + '<span class="hint">' + list.length + " 檔</span></h2><div class=\"v2-note\" style=\"margin:0 0 6px\">" + hint + "</div>" + (list.length ? list.map(patRow).join("") : '<div class="v2-empty">今天沒有</div>') + "</div>";
  });
  el.innerHTML = h;
}

/* ---------- 搜尋 ---------- */
(function () {
  var q = $("q"), res = $("qres"), all = Object.keys(idx).map(function (c) { return idx[c]; });
  var inds = {}; all.forEach(function (s) { if (s.industry) inds[s.industry] = 1; });
  function run() {
    var t = q.value.trim().toLowerCase(); if (!t) { res.style.display = "none"; return; }
    var m = all.filter(function (s) { return s.code.indexOf(t) === 0 || (s.name || "").toLowerCase().indexOf(t) >= 0; }).slice(0, 8);
    var im = Object.keys(inds).filter(function (n) { return n.toLowerCase().indexOf(t) >= 0; }).slice(0, 3);
    var h = im.map(function (n) { return '<button data-ind-go="' + esc(n) + '"><span>板塊｜' + esc(n) + "</span><span>看輪動</span></button>"; }).join("") +
      m.map(function (s) { return '<button data-open-go="' + esc(s.code) + '"><span>' + esc(s.code + " " + s.name) + '</span><span class="v2-tag ind">' + esc(s.industry || "") + "</span></button>"; }).join("");
    res.innerHTML = h || '<button disabled>找不到符合的個股</button>'; res.style.display = "block";
  }
  q.addEventListener("input", run);
  res.addEventListener("click", function (e) {
    var a = e.target.closest("[data-open-go]"), b = e.target.closest("[data-ind-go]");
    if (a) { openSheet(a.dataset.openGo); } else if (b) { showTab("overview"); selectIndustry(b.dataset.indGo); $("rrgCard").scrollIntoView({ behavior: "smooth" }); }
    res.style.display = "none"; q.value = "";
  });
  document.addEventListener("click", function (e) { if (!e.target.closest(".v2-search")) res.style.display = "none"; });
})();

renderHighlights(); renderRrg(); renderPicks(); setRankSub(SF ? "sector" : "signals"); renderSectorRank(); renderStockRank(); renderPattern(); renderSignals(); renderFund(); renderWatch();
})();
</script>
